<!DOCTYPE html>
<html lang="es" class="light">

<head>
  <meta charset="UTF-8" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self' ws: http://localhost:*;" />
  <title>Generador H5P</title>

  <!-- Google Fonts: Titillium Web -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/light.css">
  <link rel="stylesheet" href="css/global.css">
</head>

<body>
  <header class="topbar">
    <h1 class="app-title">Generador H5P</h1>
    <button id="btn-menu" class="btn-icon" title="Abrir menu" type="button" aria-label="Abrir menu"
      aria-controls="side-menu" aria-expanded="false">
      <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <nav id="side-menu" class="side-menu" aria-label="Navegación principal" aria-hidden="true">
    <div class="side-menu-header">
      <h2>Menú</h2>
      <button id="btn-close-menu" class="btn-icon" type="button" title="Cerrar menú" aria-label="Cerrar menú">
        <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="side-menu-content">
      <button class="menu-item" type="button" id="menu-opt-history">
        <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Archivos Creados</span>
      </button>

      <button class="menu-item" type="button" id="menu-opt-settings">
        <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        <span>Opciones</span>
      </button>
    </div>
  </nav>

  <div id="menu-overlay" class="menu-overlay" aria-hidden="true"></div>

  <main class="step-container">
    <section id="panel-upload" class="step-panel"></section>
    <section id="panel-selector" class="step-panel hidden"></section>
    <section id="panel-export" class="step-panel hidden"></section>
  </main>

  <!-- Pie de ventana permanente con el stepper -->
  <footer class="app-footer">
    <ol class="stepper" aria-label="Pasos del proceso">
      <li class="step-item active" id="step-indicator-1" aria-current="step">
        <span class="step-num">1</span>
        <span class="step-text">Subir y Prompt</span>
      </li>
      <li class="step-item" id="step-indicator-2">
        <span class="step-num">2</span>
        <span class="step-text">Tipo H5P</span>
      </li>
      <li class="step-item" id="step-indicator-3">
        <span class="step-num">3</span>
        <span class="step-text">Exportar</span>
      </li>
    </ol>
  </footer>

  <!-- Modal de Previsualización de Archivos -->
  <div id="preview-modal" class="preview-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title" aria-hidden="true">
    <div class="preview-dialog">
      <header class="preview-header">
        <div class="preview-title-wrap">
          <svg class="icon-svg preview-header-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <div class="preview-meta-text">
            <h2 id="preview-modal-title" class="preview-title">Previsualización</h2>
            <span id="preview-modal-subtitle" class="preview-subtitle"></span>
          </div>
        </div>
        <button id="btn-close-preview" class="btn-icon" type="button" title="Cerrar vista previa (Escape)" aria-label="Cerrar vista previa">
          <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <div class="preview-body" id="preview-body">
        <!-- Contenido dinámico (iframe para PDF, pre para texto, tarjeta para binarios) -->
      </div>

      <footer class="preview-footer">
        <div class="preview-nav-controls">
          <button type="button" class="btn-icon btn-nav-preview" id="btn-prev-preview" title="Archivo anterior (Flecha izquierda)" aria-label="Archivo anterior">
            <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span class="preview-counter-badge" id="preview-counter">1 / 1</span>
          <button type="button" class="btn-icon btn-nav-preview" id="btn-next-preview" title="Archivo siguiente (Flecha derecha)" aria-label="Archivo siguiente">
            <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
        <div class="preview-file-details" id="preview-file-details">
          <!-- Detalles del archivo actual -->
        </div>
      </footer>
    </div>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/config.js"></script>
</body>

</html>
